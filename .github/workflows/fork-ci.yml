name: Fork CI

on:
  pull_request:
    branches: [feat/mobile-bot-layout]
  push:
    branches: [feat/mobile-bot-layout]

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: ds-bot
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ds-bot/package-lock.json
            ds-bot/dev/harness/package-lock.json
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - id: harness-pin
        name: Read pinned Harness version
        run: |
          set -euo pipefail
          version=$(node -p 'require("./dev/harness/package.json").dependencies["@deepseek-ai/dsh"]')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || {
            echo 'The pinned DSH Harness version is not a valid SemVer value.' >&2
            exit 1
          }
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v${{ steps.harness-pin.outputs.version }}
          path: deepseek-harness
          persist-credentials: false
      - name: Install pinned DSH source dependencies
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile
      - name: Build pinned DSH Harness
        working-directory: deepseek-harness
        run: pnpm run build
      - run: npm ci --no-fund --no-audit
      - name: Install pinned DSH test harness
        run: npm run harness
      - name: Check committed client bundle
        run: node scripts/build-client.mjs --check
      - run: npm test
      - name: Build client
        run: npm run build
      - name: Check generated bundle is committed
        run: node scripts/build-client.mjs --check && git diff --exit-code -- client.js
      - name: Lint
        run: npm run lint
      - name: Reject merge conflict markers
        working-directory: .
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)($|[[:space:]])' -- .; then
            echo 'Unresolved merge-conflict markers found.' >&2
            exit 1
          fi
      - name: Find Chromium
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            echo 'No Chromium-compatible browser is installed on this runner.' >&2
            exit 1
          fi
          echo "CHROME_BIN=$browser" >> "$GITHUB_ENV"
      - name: Exercise Web UI at mobile and desktop widths
        working-directory: .
        env:
          DSH_HARNESS: ${{ github.workspace }}/deepseek-harness
          SLOT: '4'
        run: ds-bot/dev/check.sh --only web --out "$RUNNER_TEMP/mobile-ui"
      - name: Smoke-test deployment and rollback scripts
        run: |
          set -euo pipefail
          for script in ../deploy/vps/*.sh; do bash -n "$script"; done
          bundle="$RUNNER_TEMP/deploy-smoke"
          mkdir -p "$bundle"
          npm pack --silent --pack-destination "$bundle" > "$RUNNER_TEMP/smoke-package-name"
          mv "$bundle/$(cat "$RUNNER_TEMP/smoke-package-name")" "$bundle/plugin.tgz"
          cp ../deploy/vps/rollback.sh "$bundle/rollback.sh"
          bash ../deploy/vps/test.sh "$bundle/plugin.tgz"
      - name: Package the tested plugin and deployment logic
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/ds-bot-release"
          mkdir -p "$bundle"
          npm pack --silent --pack-destination "$bundle" > "$RUNNER_TEMP/pack-name"
          package_name="$(cat "$RUNNER_TEMP/pack-name")"
          mv "$bundle/$package_name" "$bundle/plugin.tgz"
          printf '%s\n' "$GITHUB_SHA" > "$bundle/commit.txt"
          cp ../deploy/vps/deploy.sh "$bundle/deploy.sh"
          cp ../deploy/vps/rollback.sh "$bundle/rollback.sh"
          (cd "$bundle" && sha256sum plugin.tgz deploy.sh rollback.sh > SHA256SUMS)
          tar -czf "$RUNNER_TEMP/ds-bot-release.tar.gz" -C "$bundle" plugin.tgz SHA256SUMS commit.txt deploy.sh rollback.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: ds-bot-release
          path: ${{ runner.temp }}/ds-bot-release.tar.gz
          if-no-files-found: error
          retention-days: 2
